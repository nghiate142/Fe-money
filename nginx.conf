server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 4m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Router chạy phía client: mọi đường dẫn không phải file đều trả index.html,
  # nếu không thì F5 ở /debts sẽ ra 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # File có hash trong tên nên cache được lâu; index.html thì không.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Backend đi qua cùng origin -> trình duyệt không cần CORS.
  # Dấu / cuối proxy_pass cắt tiền tố /api trước khi chuyển tiếp.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
